name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Takt.sln
      - name: Build
        run: dotnet build Takt.sln -c Release --no-restore
      - name: Test
        run: dotnet test Takt.sln -c Release --no-build --verbosity minimal
      - name: Publish framework-dependent
        run: dotnet publish src/Takt/Takt.csproj -c Release -p:PublishProfile=win-x64
      - name: Publish self-contained
        run: dotnet publish src/Takt/Takt.csproj -c Release -p:PublishProfile=win-x64-selfcontained
      - uses: actions/upload-artifact@v4
        with:
          name: takt-win-x64
          path: publish/win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: takt-win-x64-selfcontained
          path: publish/win-x64-selfcontained/
